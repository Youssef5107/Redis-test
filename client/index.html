<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redis Caching Benchmark</title>
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #38bdf8;
        --primary-hover: #0284c7;
        --accent-green: #22c55e;
        --accent-yellow: #eab308;
        --code-bg: #0f172a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      }

      .header {
        margin-bottom: 1.5rem;
      }

      .title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }

      .btn {
        width: 100%;
        background-color: var(--primary);
        color: #0f172a;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background-color: var(--primary-hover);
        color: #fff;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .metric-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
      }

      .metric-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }

      .metric-value {
        font-size: 1.5rem;
        font-weight: 700;
        margin-top: 0.25rem;
      }

      .metric-value.fast {
        color: var(--accent-green);
      }

      .metric-value.slow {
        color: var(--accent-yellow);
      }

      .response-container {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .response-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .status-badge {
        font-size: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 9999px;
        background: var(--border);
        color: var(--text-muted);
      }

      .status-badge.hit {
        background: rgba(34, 197, 94, 0.2);
        color: var(--accent-green);
      }

      .status-badge.miss {
        background: rgba(234, 179, 8, 0.2);
        color: var(--accent-yellow);
      }

      pre {
        background-color: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8125rem;
        color: #e2e8f0;
        height: 160px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1 class="title">⚡ Redis Cache Benchmark</h1>
        <p class="subtitle">
          Measure performance differences between API requests & Redis cache.
        </p>
      </div>

      <button id="fetchBtn" class="btn">Fetch 5,000 Records</button>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Response Time</div>
          <div id="time" class="metric-value">-</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Items Fetched</div>
          <div id="count" class="metric-value">-</div>
        </div>
      </div>

      <div class="response-container">
        <div class="response-header">
          <span>Payload Preview</span>
          <span id="badge" class="status-badge">Idle</span>
        </div>
        <pre id="output">Click the button above to begin fetching...</pre>
      </div>
    </div>

    <script>
      const btn = document.getElementById("fetchBtn");
      const timeEl = document.getElementById("time");
      const countEl = document.getElementById("count");
      const outputEl = document.getElementById("output");
      const badgeEl = document.getElementById("badge");

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        outputEl.textContent = "Fetching records...";
        badgeEl.textContent = "Requesting...";
        badgeEl.className = "status-badge";

        const startTime = performance.now();

        try {
          const response = await fetch("http://localhost:3000/photos");
          const data = await response.json();
          const endTime = performance.now();

          const duration = parseFloat((endTime - startTime).toFixed(2));

          timeEl.textContent = `${duration} ms`;
          countEl.textContent = data.length.toLocaleString();
          outputEl.textContent =
            JSON.stringify(data.slice(0, 3), null, 2) + "\n\n... (truncated)";

          // Dynamic metric highlights based on speed
          if (duration < 50) {
            timeEl.className = "metric-value fast";
            badgeEl.textContent = "Cache Hit";
            badgeEl.className = "status-badge hit";
          } else {
            timeEl.className = "metric-value slow";
            badgeEl.textContent = "Cache Miss";
            badgeEl.className = "status-badge miss";
          }
        } catch (err) {
          outputEl.textContent = "Error connecting to backend server.";
          badgeEl.textContent = "Error";
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
