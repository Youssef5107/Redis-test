<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redis Caching Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 2rem;
        max-width: 600px;
        margin: auto;
      }
      button {
        padding: 10px 15px;
        font-size: 16px;
        cursor: pointer;
      }
      .stats {
        margin-top: 20px;
        font-weight: bold;
      }
      .data-box {
        background: #f4f4f4;
        padding: 10px;
        margin-top: 10px;
        height: 150px;
        overflow-y: scroll;
      }
    </style>
  </head>
  <body>
    <h2>Redis Cache Performance Test</h2>
    <button id="fetchBtn">Fetch 5,000 Photos</button>

    <div class="stats">
      <p>Response Time: <span id="time">-</span> ms</p>
      <p>Items Fetched: <span id="count">-</span></p>
    </div>

    <pre class="data-box" id="output">Click the button to test...</pre>

    <script>
      const btn = document.getElementById("fetchBtn");
      const timeEl = document.getElementById("time");
      const countEl = document.getElementById("count");
      const outputEl = document.getElementById("output");

      btn.addEventListener("click", async () => {
        const startTime = performance.now();
        outputEl.textContent = "Fetching...";

        try {
          const response = await fetch("http://localhost:3000/photos");
          const data = await response.json();
          const endTime = performance.now();

          const duration = (endTime - startTime).toFixed(2);
          timeEl.textContent = duration;
          countEl.textContent = data.length;
          outputEl.textContent =
            JSON.stringify(data.slice(0, 3), null, 2) + "\n\n... (truncated)";
        } catch (err) {
          outputEl.textContent = "Error fetching data";
        }
      });
    </script>
  </body>
</html>
